# Cloud-Mac build (Codemagic) that produces an UNSIGNED .ipa for AltStore.
# No Apple Developer account needed — AltStore re-signs on install with your free Apple ID.
#
# Setup in the Codemagic UI:
#   1. Connect this repo, pick the "ios-unsigned" workflow.
#   2. Add environment variables (group "google"), marked secure:
#        VITE_GOOGLE_MAPS_API_KEY = <your key>
#        VITE_GOOGLE_MAP_ID       = <your vector map id, optional>
#   3. Start build → download Essence.ipa from the artifacts.

workflows:
  ios-unsigned:
    name: Essence — unsigned IPA (AltStore)
    instance_type: mac_mini_m1
    max_build_duration: 60
    triggering:
      # Auto-build on every push to main. Requires the Codemagic webhook on the
      # repo (Codemagic adds it automatically for app-connected GitHub repos;
      # otherwise add it under App settings → Webhooks).
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    when:
      # Skip the build when a push only touches docs/prompts (no app or CI change).
      # Applies to webhook-triggered builds; manual "Start new build" always runs.
      changeset:
        includes:
          - "**"
        excludes:
          - "**/*.md"
          - "prompts/**"
    environment:
      node: 18
      xcode: latest
      groups:
        - google # provides VITE_GOOGLE_MAPS_API_KEY / VITE_GOOGLE_MAP_ID
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Verify Google Maps key is present
        script: |
          # Confirms the build environment has the key WITHOUT printing its value.
          # Fails fast with a clear message so a missing key never ships silently.
          if [ -z "$VITE_GOOGLE_MAPS_API_KEY" ]; then
            echo "MISSING: VITE_GOOGLE_MAPS_API_KEY is empty."
            echo "Add it to the 'google' env-var group (secure) attached to this workflow."
            exit 1
          fi
          echo "PRESENT: VITE_GOOGLE_MAPS_API_KEY (len=${#VITE_GOOGLE_MAPS_API_KEY})"
          if [ -n "$VITE_GOOGLE_MAP_ID" ]; then
            echo "PRESENT: VITE_GOOGLE_MAP_ID (len=${#VITE_GOOGLE_MAP_ID})"
          else
            echo "NOTE: VITE_GOOGLE_MAP_ID is empty (optional — raster map will be used)."
          fi
      - name: Build web app
        script: npm run build
      - name: Add iOS platform (fresh)
        script: |
          rm -rf ios
          npx cap add ios
      - name: Generate app icons
        script: npx @capacitor/assets generate --ios || true
      - name: Add location permission strings
        script: |
          PLIST="ios/App/App/Info.plist"
          MSG="Pour afficher votre position et vous guider vers les stations d'essence."
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string $MSG" "$PLIST"
      - name: Sync web assets into iOS project
        script: npx cap sync ios
      - name: Build unsigned archive
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
      - name: Package unsigned IPA
        script: |
          cd "$CM_BUILD_DIR/App.xcarchive/Products/Applications"
          # Fail early if the archive didn't actually produce the app.
          test -d App.app || { echo "ERROR: App.app is missing from the archive"; exit 1; }
          test -f App.app/Info.plist || { echo "ERROR: App.app/Info.plist is missing"; exit 1; }
          echo "App.app size: $(du -sh App.app | cut -f1)"
          echo "=== App.app contents ==="
          ls -la App.app
          echo "=== size of each item in App.app ==="
          du -sh App.app/* 2>/dev/null | sort -h
          echo "=== App.app/Frameworks ==="
          ls -la App.app/Frameworks 2>/dev/null || echo "!! NO Frameworks folder (dynamic frameworks not embedded)"
          echo "=== web assets (App.app/public) ==="
          ls App.app/public 2>/dev/null | head || echo "!! NO public folder (web build not bundled)"
          echo "=== main binary ==="
          ls -la App.app/App 2>/dev/null || echo "!! NO App binary"
          echo "=== .framework anywhere in the archive ==="
          find "$CM_BUILD_DIR/App.xcarchive" -name "*.framework" 2>/dev/null | head -50
          mkdir -p Payload
          mv App.app Payload/App.app
          # -y keeps symlinks intact, -X drops extra file attributes.
          zip -r -y -X "$CM_BUILD_DIR/Essence.ipa" Payload
          # Validate the container AltStore will read, and report its size.
          unzip -l "$CM_BUILD_DIR/Essence.ipa" | grep -q "Payload/App.app/Info.plist" \
            || { echo "ERROR: IPA is malformed (no Payload/App.app/Info.plist)"; exit 1; }
          IPA_SIZE=$(du -h "$CM_BUILD_DIR/Essence.ipa" | cut -f1)
          echo "IPA OK: $IPA_SIZE"
          # A valid IPA is multiple MB; warn loudly if it looks suspiciously small.
          IPA_BYTES=$(stat -f%z "$CM_BUILD_DIR/Essence.ipa")
          if [ "$IPA_BYTES" -lt 2000000 ]; then
            echo "WARNING: IPA is only $IPA_SIZE ($IPA_BYTES bytes) — expected several MB."
            echo "The native binary/frameworks may be missing from the archive."
          fi
    artifacts:
      - Essence.ipa
